<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1425" width="900" height="1425">
      
      <defs>
        <clipPath id="cardClip">
          <rect x="20" y="20" width="860" height="1385" rx="44" />
        </clipPath>
        <style>
          .member-name { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 500; font-size: 32px; fill: #0f172a; }
          .member-plan { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 400; font-size: 24px; fill: #1e293b; }
          .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 16px; fill: #1e293b; }
          .val { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 500; font-size: 20px; fill: #0f172a; }
          .scan-lbl { font-family: 'Times New Roman', 'Georgia', serif; font-weight: 700; font-size: 13px; fill: #111827; letter-spacing: 1px; }
        </style>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.12"/>
        </filter>
        <linearGradient id="selectOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#f3f4f6" />
        </linearGradient>
        <linearGradient id="selectInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>
        <linearGradient id="prefOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e5e7eb" />
          <stop offset="50%" stop-color="#d1d5db" />
          <stop offset="100%" stop-color="#9ca3af" />
        </linearGradient>
        <linearGradient id="prefInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f9fafb" />
          <stop offset="100%" stop-color="#e5e7eb" />
        </linearGradient>
        <linearGradient id="sigOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="30%" stop-color="#eab308" />
          <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <linearGradient id="sigInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef08a" />
          <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
      </defs>

      <!-- Outer Background Card -->
      <image href="https://airoessentials.com/templates/select.jpg?v=1785442038028" x="20" y="20" width="860" height="1385" preserveAspectRatio="xMidYMid slice" clip-path="url(#cardClip)" />

      <!-- Top Branding -->
      

      <!-- Inner Digital Membership Card -->
      

      <!-- Inner Logos -->
      

      <!-- Member Details -->
      <g transform="translate(130, 1065)">
        <text x="0" y="0" class="member-name">MUKESH LAUDYA</text>
        <text x="0" y="38" class="member-plan">Select Member</text>
        <g transform="translate(0, 100)">
          <text x="0" y="0" class="lbl">One ID</text>
          <text x="0" y="28" class="val">AIRO1000001</text>
          <text x="170" y="0" class="lbl">Valid Until</text>
          <text x="170" y="28" class="val">July 28 2027</text>
        </g>
      </g>

      <!-- QR Code Container -->
      <g transform="translate(590, 1035)">
        <text x="50" y="-15" class="scan-lbl" text-anchor="middle">SCAN TO VERIFY</text>
        <image href="data:image/png;base64," x="-10" y="-10" width="120" height="120" />
      </g>

    </svg>